name: DebugRingExample
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.orisun.DebugRingExample
    TARGETED_DEVICE_FAMILY: '1,2'
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: '$(inherited) DEBUG=1 DEBUG_RING=1'
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG'
targets:
  DebugRingExample:
    type: application
    platform: iOS
    sources: [DebugRingExample]
  DebugRingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DebugRingTests]
    deploymentTarget: '17.0'
    dependencies:
      - target: DebugRingExample
schemes:
  DebugRingExample:
    build:
      targets:
        DebugRingExample: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [DebugRingTests]
